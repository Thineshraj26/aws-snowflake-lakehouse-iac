version: 2

sources:
  - name: bronze
    database: LAKEHOUSE_DB
    schema: BRONZE
    tables:
      - name: raw_orders
        description: "Landing table for ingested S3 Parquet transactional data"
        config:
          loaded_at_field: _loaded_at
          freshness:
            warn_after:
              count: 24
              period: hour
            error_after:
              count: 48
              period: hour